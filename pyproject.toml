[project]
name = "agrivibe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dakshina Lakshan", email = "dakshinalakshanrajinda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.151.0",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
]

[project.scripts]
agrivibe = "agrivibe:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.fastapi]
entrypoint = "agrivibe.main:app"